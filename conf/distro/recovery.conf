DISTRO = "recovery"
DISTRO_NAME = "Mono Recovery Linux"
DISTRO_VERSION = "1.0"
MAINTAINER = "Tomaz Zaman <tomaz@mono.si>"

# Minimal features - no systemd, no GUI.
# ipv4/ipv6 are required: OE-core's busybox.inc gates CONFIG_FEATURE_IPV6
# (and the IFUPDOWN_IPV4/IPV6 helpers) on these flags. Without them busybox
# tools like ping, nslookup, wget reject IPv6 literals as "bad address",
# which breaks recovery on IPv6-only networks (issue #9).
DISTRO_FEATURES = "ipv4 ipv6"

# Use BusyBox init instead of systemd. INIT_MANAGER drives the whole
# selection in wrynose+: it defaults to "systemd" (defaultsetup.conf),
# which appends "systemd usrmerge" to DISTRO_FEATURES via
# init-manager-systemd.inc. That makes recipes like fancontrol/sfp-led
# install .service units instead of init.d scripts, which busybox init
# can't start. Selecting mdev-busybox here keeps systemd out of
# DISTRO_FEATURES and pulls in busybox-mdev + initscripts.
INIT_MANAGER = "mdev-busybox"

# Use BusyBox for basic utilities
VIRTUAL-RUNTIME_base-utils = "busybox"

# Quality assurance checks
ERROR_QA:append = " textrel host-user-contaminated"
WARN_QA:append = " buildpaths ldflags"
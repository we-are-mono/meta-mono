#@TYPE: Machine
#@NAME: Gateway Development Kit
#@DESCRIPTION: Machine configuration for Gateway Development Kit with LS1046A CPU
#@MAINTAINER: Tomaz Zaman <tomaz@mono.si>

MACHINEOVERRIDES =. "fsl-lsch2:qoriq-arm64:ls1046a:"

# CPU Architecture and tuning
require conf/machine/include/arm/armv8a/tune-cortexa72.inc

# QorIQ-specific variables
MACHINE_SOCARCH = "cortexa72"
SOC_FAMILY = "qoriq:ls1046a"

# Basic info about the hardware
MACHINE_FEATURES = "usbhost pci rtc serial"

SERIAL_CONSOLES = "115200;ttyS0"

# Kernel configuration
PREFERRED_PROVIDER_virtual/kernel = "linux-mono"

KERNEL_IMAGETYPE ?= "Image.gz"
KERNEL_DEVICETREE = "freescale/mono-gateway-dk.dtb"

# Where the FIT tells u-boot to place the kernel. It unpacks to ~52MB
# (the recovery initramfs is bundled in), so it has to sit clear of the
# address the FIT itself is read to (${loadaddr} = 0xa0000000).
UBOOT_LOADADDRESS = "0x80080000"
UBOOT_ENTRYPOINT = "0x80080000"

# uboot-config (pulled in by kernel-fit-image) resolves the defconfig here.
UBOOT_MACHINE = "mono_gateway_dk_defconfig"

# Force initramfs integration into the kernel
INITRAMFS_IMAGE = "recovery-image"
INITRAMFS_IMAGE_NAME = "recovery-image.rootfs"
INITRAMFS_IMAGE_BUNDLE = "1"
# In KiB, not bytes, and measured on the *uncompressed* rootfs after
# IMAGE_OVERHEAD_FACTOR. Currently ~59MiB against a 64MiB cap. This is an
# early warning for the check that actually protects the flash layout:
# firmware-image.bb refuses a fitImage over its 24MiB window.
INITRAMFS_MAXSIZE = "65536"

# Firmware version (CalVer: YYYY.MM.N)
FIRMWARE_VERSION ?= "2026.09.2"

# Firmware locations
RCWQSPI ?= "NN_FFSSPSNP_1133_5A06/rcw_2100_qspiboot.bin"
RCWEMMC ?= "NN_FFSSPSNP_1133_5A06/rcw_2100_emmcboot.bin"
RCWQSPI1G ?= "NN_FSSSPSNP_1333_5A06/rcw_2100_qspiboot.bin"
RCWEMMC1G ?= "NN_FSSSPSNP_1333_5A06/rcw_2100_emmcboot.bin"
# Upstream ships the microcode under a version-stamped name, but the
# deployed copy may be replaced by a licensed build carrying a different
# version. Keeping the deployed name neutral stops the filename
# advertising a version it may not contain -- check the U-Boot banner
# ("Fman1: Uploading microcode version ...") for what actually shipped.
FMAN_UCODE_SRC ?= "fsl_fman_ucode_ls1046_r1.0_108_4_9.bin"
FMAN_UCODE ?= "fsl_fman_ucode.bin"

# Build optimization, change these according to your number of cpus available.
# Run `$ nproc` to see how many you can allocate to Yocto/bitbake.
PARALLEL_MAKE = "-j 16"
BB_NUMBER_THREADS = "16"

# Shared cache locations. For reusability purposes, it's much better to have all
# the downloaded sources and state caches outside of the project directory.
# Make sure to set correct permissions on these directories.
DL_DIR = "/opt/yocto/downloads"
SSTATE_DIR = "/opt/yocto/sstate"

# Firmware image signing (ECDSA P-256)
# Uncomment and set paths to enable signing of firmware images.
# Generate keys with:
#   openssl ecparam -genkey -name prime256v1 -noout -out firmware-signing.pem
#   openssl ec -in firmware-signing.pem -pubout -out firmware-signing.pub
#FIRMWARE_SIGNING_KEY = "/path/to/firmware-signing.pem"
#FIRMWARE_SIGNING_PUBKEY = "/path/to/firmware-signing.pub"

# SDK settings
SDKMACHINE = "x86_64"

# Network settings
BB_FETCH_PREMIRRORONLY = "0"
BB_GENERATE_MIRROR_TARBALLS = "0"
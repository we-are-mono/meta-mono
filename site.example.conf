# Build optimization, change these according to your number of cpus available.
# Run `$ nproc` to see how many you can allocate to Yocto/bitbake.
PARALLEL_MAKE = "-j 16"
BB_NUMBER_THREADS = "16"

# Shared cache locations. For reusability purposes, it's much better to have all
# the downloaded sources and state caches outside of the project directory.
# Make sure to set correct permissions on these directories.
DL_DIR = "/opt/yocto/downloads"
SSTATE_DIR = "/opt/yocto/sstate"
# Keep the hash-equivalency DB next to SSTATE so sstate reuse works across
# builds (wrynose+ requirement; the DB defaults to the build dir otherwise).
BB_HASHSERVE_DB_DIR = "${SSTATE_DIR}"

# Build artifacts: do NOT override DEPLOY_DIR_IMAGE — it causes pseudo inode
# tracking conflicts. Instead, create a symlink:
#   ln -sfn build/tmp/deploy/images/gateway-dk dist

# Firmware image signing (ECDSA P-256)
# Uncomment and set paths to enable signing of firmware images.
# Generate keys with:
#   openssl ecparam -genkey -name prime256v1 -noout -out firmware-signing.pem
#   openssl ec -in firmware-signing.pem -pubout -out firmware-signing.pub
#FIRMWARE_SIGNING_KEY = "/path/to/firmware-signing.pem"
#FIRMWARE_SIGNING_PUBKEY = "/path/to/firmware-signing.pub"
# Set to "1" to make the build fail if signing keys are missing (recommended
# for any build you'd actually ship). Leave at "0" for unsigned dev builds.
#FIRMWARE_SIGNING_REQUIRED = "1"

# TFTP deploy for dev-image (used by kas-dev.yaml)
# Set to your TFTP server directory to auto-deploy fitImage after build.
# Leave empty or commented out to disable.
#TFTP_DEPLOY_DIR = "/srv/tftp"

# Network settings
BB_FETCH_PREMIRRORONLY = "0"
BB_GENERATE_MIRROR_TARBALLS = "0"

# CVE-scan the image SBOM via sbom-cve-check. Non-gating: unpatched CVEs
# surface as build warnings plus a manifest in the deploy dir
# (<image>.sbom-cve-check.yocto.json and <image>.cve.txt); the build does
# not fail on a CVE. Pulls in create-spdx and floats the CVE database to
# AUTOREV so each build checks against current CVE data.
OE_FRAGMENTS += "core/yocto/sbom-cve-check"
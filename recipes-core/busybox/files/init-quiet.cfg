# Keep init's bookkeeping off the console.
#
# init logs each inittab entry it runs with message(L_LOG, ...), meant for a
# log rather than the console. Without INIT_SYSLOG it writes L_LOG to a log
# tty, defaulting to /dev/tty5 -- but console_init() clears that device when
# VT_OPENQRY fails, which it does on a serial console, leaving the fallback of
# stderr. So a board with virtual terminals hides these and this one shows
# them. INIT_SYSLOG routes L_LOG to syslog() instead, where it is dropped if
# nothing is listening; L_CONSOLE messages still reach the console, so real
# failures remain visible.
CONFIG_FEATURE_INIT_SYSLOG=y

# Drop the "init started: BusyBox v..." banner, which the recovery boot has no
# use for -- the version is in the firmware self-test and the u-boot banner.
CONFIG_FEATURE_INIT_QUIET=y

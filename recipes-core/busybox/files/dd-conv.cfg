# Give dd the conv=, iflag= and oflag= options. Without IBS_OBS the applet
# silently rejects conv=notrunc and conv=fsync, so scripts have to follow every
# dd with a separate sync. STATUS adds status=none and status=noxfer only --
# busybox has no status=progress; send SIGUSR1 to a running dd for that.
CONFIG_FEATURE_DD_IBS_OBS=y
CONFIG_FEATURE_DD_STATUS=y
